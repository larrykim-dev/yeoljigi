<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>열지기 — 주소가 바뀌었어요</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="열지기 — 주소가 바뀌었어요">
  <meta property="og:description" content="새 주소: yeoljigi.github.io">
  <meta property="og:image" content="https://yeoljigi.github.io/icons/og.png?v=2">
  <link rel="canonical" href="https://yeoljigi.github.io/">
  <style>
    :root { --bg: #f6f4f1; --surface: #fff; --text: #1d2230; --text-2: #5b6272; --brand: #ff7a59; --brand-ink: #fff; --line: #e6e1da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1218; --surface: #181c25; --text: #eef0f5; --text-2: #aab1c0; --brand: #ff8a6b; --brand-ink: #1a0f0b; --line: #2a303d; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { max-width: 440px; margin: 0 auto; padding: 40px 16px; }
    .card { background: var(--surface); border-radius: 18px; padding: 22px 20px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: var(--text-2); margin: 8px 0; }
    .btn { display: block; width: 100%; box-sizing: border-box; text-align: center; padding: 15px; border-radius: 14px; font: inherit;
      font-weight: 700; border: 0; text-decoration: none; margin-top: 12px; cursor: pointer; }
    .primary { background: var(--brand); color: var(--brand-ink); }
    .ghost { background: none; color: var(--text); border: 1px solid var(--line); }
    ol { color: var(--text-2); padding-left: 20px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
<main><div class="card">
  <h1>열지기 주소가 바뀌었어요</h1>
  <p>새 주소: <b>yeoljigi.github.io</b></p>
  <div id="has" hidden>
    <p>이 휴대폰에 예전 주소에서 남긴 기록이 있어요. 기록은 주소마다 따로 저장돼서, 새 주소로 옮기려면 백업 파일로 넘겨야 해요.</p>
    <ol>
      <li>아래 「기록 백업 파일 받기」를 눌러 저장</li>
      <li>「새 주소로 가기」 → 설정 → <b>백업 파일 불러오기</b>에서 그 파일 고르기</li>
    </ol>
    <button class="btn primary" id="save">기록 백업 파일 받기</button>
    <p id="count" style="font-size:14px"></p>
  </div>
  <a class="btn ghost" id="go" href="https://yeoljigi.github.io/">새 주소로 가기</a>
  <p style="font-size:14px">새 주소를 홈 화면에 다시 추가해 주세요. 예전 아이콘은 지워도 돼요(백업을 받은 뒤에).</p>
</div></main>
<script>
  // 예전 주소(larrykim-dev.github.io/yeoljigi)의 기록 — 열지기 백업 파일과 같은 모양으로 내려받게 한다
  const KEY = 'yeoljigi.v1';
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* 저장소를 못 읽으면 바로 새 주소로 */ }
  let state = null;
  try { state = raw ? JSON.parse(raw) : null; } catch (e) { state = null; }
  const kids = state && Array.isArray(state.children) ? state.children.length : 0;
  const entries = state && Array.isArray(state.entries) ? state.entries.length : 0;
  if (kids) {
    document.getElementById('has').hidden = false;
    document.getElementById('count').textContent = `아이 ${kids}명 · 기록 ${entries}건`;
    document.getElementById('save').addEventListener('click', () => {
      const d = new Date();
      const blob = new Blob([JSON.stringify({ app: 'yeoljigi', exportedAt: d.toISOString(), ...state }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `열지기-백업-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
      document.body.append(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
  } else {
    location.replace('https://yeoljigi.github.io/');
  }
  // 예전 앱의 서비스 워커 · 캐시를 지운다 — 남아 있으면 예전 판이 계속 열린다
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
  if (globalThis.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
